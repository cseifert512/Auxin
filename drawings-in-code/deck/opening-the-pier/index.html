<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Opening the pier</title>
<!--
  For the pier study. One picture, one idea: the same pier and the same four climbers, grown twice by the plant
  simulator, side by side for ten years. On the left the pier's legs stand together; on the right they stand apart,
  as the design has them, and the sun reaches the climbers at their feet.

  Two fixed views at one scale: pier R1.P1 straight on, from outside the room, looking at its centre; orthographic
  elevations from just below the soil, sharing one soil line. Only time moves: ten years in about 75 seconds, both
  sides in step, holding on June of the tenth year before it loops. Under the pictures, the study: the six openings
  of the pier in plan, the climbers that get their light and the way in between the piers, the ones the footing draft
  rejects struck in red, the design ringed. The rail is the ten years.

  Everything drawn comes from data.js, which `node pipeline/vignette.mjs opening-the-pier` writes (data.mjs says how):
  two runs of the plant simulator cut down to this pier, and the building model's timber at this pier in each
  opening. What is on a plant on a day is decided here by the simulator's own rules (presence.ts, as grown.py ports
  them). Drag the handle, or sideways on the pictures, to move through the years; as soon as you let go it
  carries on. ?embed (no title, no keys) ?still. Hooks: __setT(seconds) (draws at once), __play(), __duration, __ready.
-->
<style>
  @font-face { font-family: 'Safiro'; src: url('../../4/assets/fonts/safiro-regular-webfont.woff2') format('woff2'), url('../../../../deck/designx/4/assets/fonts/safiro-regular-webfont.woff2') format('woff2'); font-weight: 400; }
  @font-face { font-family: 'Argesta Display'; font-style: italic; src: url('../../4/assets/fonts/argestadisplay-regularitalic-webfont.woff2') format('woff2'), url('../../../../deck/designx/4/assets/fonts/argestadisplay-regularitalic-webfont.woff2') format('woff2'); }
  :root { --paper: #EEF3EA; --ink: #102820; --muted: #536d59; --sans: 'Safiro', 'Segoe UI', system-ui, sans-serif; --display: 'Argesta Display', Georgia, serif; --k: 1; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b1a14; color: var(--ink); font: 16px/1.4 var(--sans); }
  .embed, .embed body { background: var(--paper); }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  #stage { position: absolute; left: 50%; top: 50%; width: 1600px; height: 900px; transform: translate(-50%, -50%) scale(var(--k)); overflow: hidden; background: var(--paper); }
  canvas { position: absolute; inset: 0; width: 1600px; height: 900px; display: block; cursor: ew-resize; touch-action: none; }
  #inspect { position: absolute; right: 52px; top: 40px; text-align: right; }
  #realbtn { font: 400 17px/1.3 var(--sans); color: var(--muted); padding: 6px 0; text-shadow: 0 1px 6px var(--paper); }
  #realbtn::after { content: ' +'; }
  #realbtn[aria-expanded="true"]::after { content: ' \2212'; }
  #real { position: absolute; right: 0; top: 38px; width: 560px; text-align: left; background: #eef3eafa; border: 1px solid #b1c1b5; padding: 22px 26px; box-shadow: 0 8px 25px #10282015; color: #284639; font: 400 15px/1.45 var(--sans); z-index: 2; }
  #real p { margin: 0 0 9px; }
  #real p:last-child { margin: 0; }
  button:focus-visible { outline: 2px solid #789951; outline-offset: 5px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="c" aria-label="The same pier of the Bower and the same four climbers grown twice over ten years, side by side: on the left its legs stand together, on the right apart; below, the six openings of the pier that were studied"></canvas>
  <div id="inspect">
    <button id="realbtn" type="button" aria-expanded="false">What is real</button>
    <div id="real" hidden></div>
  </div>
</div>
<script src="data.js"></script>
<script>
(() => {
  'use strict';
  const D = window.VIGNETTE_DATA;
  const $ = (id) => document.getElementById(id);
  const query = new URLSearchParams(location.search), EMBED = query.has('embed');
  if (EMBED) document.documentElement.classList.add('embed');
  const STILL = query.has('still') || matchMedia('(prefers-reduced-motion: reduce)').matches;
  const W = 1600, H = 900, TAU = Math.PI * 2;
  const INK = '16,40,32', RED = '180,73,47', PAPER = '#EEF3EA', STEM = 'rgb(88,70,52)';
  const SANS = "'Safiro', 'Segoe UI', system-ui, sans-serif", DISPLAY = "'Argesta Display', Georgia, serif";

  // <pure> ---- small pure functions ----
  const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
  const lerp = (a, b, k) => a + (b - a) * k;
  const hex = (h) => [1, 3, 5].map((k) => parseInt(h.slice(k, k + 2), 16));
  const mix = (a, b, k) => a.map((v, i) => Math.round(lerp(v, b[i], k)));
  /** presence.ts leafState, as grown.py ports it: [how far open, how far turned], or null. Days are the run's. */
  function leafState(L, s, day) {
    if (!s) return null;
    const [, , , , , , , , first, lastRaw, ever, born, gone, jit] = L, last = lastRaw || null, j = jit / 1000, year = s.year;
    if (day < born || (gone >= 0 && day >= gone)) return null;
    const before = s.leafFallBefore;
    if (before && !ever && first < year && (last === null || last >= year - 1)) {
      if (day <= before[0] + j * (before[1] - before[0])) { const turn = s.autumnColourBefore || [before[0], before[0]]; return [1, clamp((day - turn[0] - j * 10) / Math.max(1, turn[1] - turn[0]))]; }
    }
    if (year < first || (last !== null && year > last)) return null;
    const [f0, f1] = s.leafFlush, from = Math.max(f0, born), over = born > f0 ? 21 : Math.max(1, f1 - f0);
    if (ever) { if (year === first) return day < from ? null : [clamp((day - from) / over), 0]; return [1, 0]; }
    if (day < from) return null;
    const [l0, l1] = s.leafFall;
    if (day > l0 + j * (l1 - l0)) {
      const after = s.leafFlushAfter;
      if (after && day >= after[0] && (last === null || last > year)) return [clamp((day - after[0]) / Math.max(1, after[1] - after[0])), 0];
      return null;
    }
    const [t0, t1] = s.autumnColour;
    return [clamp((day - from) / over), clamp((day - t0 - j * 10) / Math.max(1, t1 - t0))];
  }
  // </pure>

  // ---- the calendar ----
  const YS = D.yearStart, Y0 = 2027, Y1 = 2037;
  const yearOf = (day) => { let y = Y0; while (YS[y + 1] !== undefined && day >= YS[y + 1]) y++; return y; };
  const PLANTED = D.planted, LASTDAY = Math.min(...D.sides.map((s) => s.lastDay));
  const JUNE10 = YS[2036] + 166;   // 15 June 2036, the tenth summer

  // ---- the elevations: millimetres to the stage, one scale for both ----
  const S = 100, GY = 690, MIN_W = 0.018 * S;  // px per metre; the soil line; no stem drawn thinner than 18 mm across
  const UX = [420, 1260];                         // where each pier stands across; the two pictures meet at 800 px
  const HALF = [[0, 800], [800, 1600]];
  const WORDS = [52, 852];                        // where each side's title stands: left of its pier's top, clear of the leaves

  const COLOURS = [], colour = (s) => { let i = COLOURS.indexOf(s); if (i < 0) { i = COLOURS.length; COLOURS.push(s); } return i; };
  const STEMC = colour(STEM);

  // ---- each side made ready once: decoded, sorted into depth layers, colours ----
  const SIDES = D.sides.map((sd, n) => {
    const G = sd.ground / 1000;
    const sx = (u) => UX[n] + (u / 1000) * S, sy = (z) => GY - (z / 1000 - G) * S;
    for (const l of sd.leaves) { l[8] += Y0; l[9] = l[9] < 0 ? 0 : l[9] + Y0; l[3] *= 10; }
    for (const f of sd.flowers) f[3] *= 10;
    const PL = sd.plants;
    const LEAFC = PL.map((p) => [0, 1, 2].map((t) => [0, 1, 2, 3, 4, 5].map((a) => { const g = mix(hex(p.look.green[0]), hex(p.look.green[1]), t / 2), au = mix(hex(p.look.autumn[0]), hex(p.look.autumn[1]), t / 2); return colour(`rgb(${mix(g, au, a / 5)})`); })));
    const FLOWC = PL.map((p) => [0, 1, 2].map((t) => colour(`rgb(${mix(hex(p.look.flower[0]), hex(p.look.flower[1]), t / 2)})`)));
    // each leaf's place on the stage, and the last day it could be on the plant (by the end of the year after its last)
    for (const l of sd.leaves) l.push(sx(l[1]), sy(l[2]), l[12] >= 0 ? l[12] : l[9] ? YS[l[9] + 2] ?? Infinity : Infinity);
    const LEAFW = PL.map((p) => ({ pinnate: 0.42, simple: 0.4, three: 0.5 }[p.look.leaf] ?? 0.4));
    const NL = 6;
    let dmin = Infinity, dmax = -Infinity;
    for (const s of sd.stems) for (let i = 0; i < s.born.length; i++) { dmin = Math.min(dmin, s.pts[3 * i + 2]); dmax = Math.max(dmax, s.pts[3 * i + 2]); }
    const layerOf = (d) => NL - 1 - clamp(Math.floor((d - dmin) / (dmax - dmin + 1) * NL), 0, NL - 1);   // 0 farthest
    const LAYERS = Array.from({ length: NL }, () => ({ segs: [], leaves: [], flowers: [] }));
    sd.stems.forEach((s, k) => { if (s.from) LAYERS[layerOf(s.pts[2])].segs.push([k, -1]); for (let i = 1; i < s.born.length; i++) LAYERS[layerOf((s.pts[3 * i - 1] + s.pts[3 * i + 2]) / 2)].segs.push([k, i]); });
    sd.leaves.forEach((l) => LAYERS[layerOf(l[3])].leaves.push(l));     // in born-day order (data.mjs sorts them)
    sd.flowers.forEach((f) => LAYERS[layerOf(f[3])].flowers.push(f));   // in opening-day order
    // stems as segments with their stage ends, so a frame only checks days and widths
    for (const Lr of LAYERS) Lr.segs = Lr.segs.map(([k, i]) => {
      const s = sd.stems[k], a = i < 0 ? s.from : s.pts.slice(3 * i - 3, 3 * i), b = s.pts.slice(3 * Math.max(0, i), 3 * Math.max(0, i) + 3), j = Math.max(0, i);
      return { x0: sx(a[0]), y0: sy(a[1]), x1: sx(b[0]), y1: sy(b[1]), bornA: i < 0 ? s.born[0] : s.born[i - 1], goneA: i < 0 ? s.gone[0] : s.gone[i - 1], born: s.born[j], gone: s.gone[j], rad: s.rad[j] / 10 };
    });
    // and for each calendar year, only what could be alive in it, so a frame in the tenth year does not walk the first
    for (const Lr of LAYERS) {
      Lr.years = {};
      for (let y = Y0; y < Y1 + 1; y++) {
        const a = YS[y], b = YS[y + 1] ?? Infinity, endOf = (g, ga) => Math.min(g < 0 ? Infinity : g, ga < 0 ? Infinity : ga);
        Lr.years[y] = {
          segs: Lr.segs.filter((g) => Math.max(g.born, g.bornA) < b && endOf(g.gone, g.goneA) > a),
          leaves: Lr.leaves.filter((l) => l[11] < b && l[16] > a),
          flowers: Lr.flowers.filter((f) => f[5] < b && (f[6] < 0 || f[6] > a)),
        };
      }
    }
    return { sd, n, sx, sy, G, PL, LEAFC, FLOWC, LEAFW, LAYERS, SEA: sd.seasons, TIP: sd.thickening.tipRadiusMm, POW: sd.thickening.exponent, LAST: sd.lastDay };
  });

  // ---- time when nobody touches it: the planting day to June of the tenth year, then a hold, then again ----
  const MOVE = 69, HOLD = 6, RAMP = 5, DUR = MOVE + HOLD;
  /** The day at time t: a trapezoid of speed, easing in from the planting day and out into the hold. */
  function dayAt(t) {
    if (t >= MOVE) return JUNE10;
    const Dd = JUNE10 - PLANTED, v = Dd / (MOVE - RAMP);
    if (t < RAMP) return PLANTED + v * t * t / (2 * RAMP);
    if (t > MOVE - RAMP) return JUNE10 - v * (MOVE - t) ** 2 / (2 * RAMP);
    return PLANTED + v * (RAMP / 2 + t - RAMP);
  }
  const timeOf = (day) => { let a = 0, b = MOVE; for (let k = 0; k < 40; k++) { const m = (a + b) / 2; if (dayAt(m) < day) a = m; else b = m; } return a; };

  // ---- drawing ----
  const canvas = $('c'), ctx = canvas.getContext('2d');
  const back = document.createElement('canvas'), bctx = back.getContext('2d');   // what never changes, drawn once
  let K = 1;
  const RAIL = { x0: 120, x1: 1500, y: 864 };
  const railX = (d) => RAIL.x0 + (RAIL.x1 - RAIL.x0) * (d - YS[Y0]) / (YS[Y1] - YS[Y0]);
  const STRIP = { y: 736, x: (i) => UX[0] + i * (UX[1] - UX[0]) / 4, PS: 18, head: 330 };   // the plans: the first under the left pier, the fifth under the right; what each row says, to their left
  function line(c, pts) { c.beginPath(); pts.forEach((q, i) => (i ? c.lineTo(q[0], q[1]) : c.moveTo(q[0], q[1]))); c.stroke(); }
  function text(c, s, x, y, size, color, face = SANS, align = 'left', style = '', halo = 0) {
    c.font = `${style} 400 ${size}px ${face}`; c.textAlign = align; c.textBaseline = 'alphabetic';
    if (halo) { c.lineJoin = 'round'; c.strokeStyle = PAPER; c.lineWidth = halo; c.strokeText(s, x, y); }
    c.fillStyle = color; c.fillText(s, x, y);
  }

  /** The back: paper, the timber of each side, the soil, the study, the sentence, the rail without its handle. */
  function drawBack() {
    back.width = canvas.width; back.height = canvas.height;
    const c = bctx;
    c.setTransform(K, 0, 0, K, 0, 0);
    c.fillStyle = PAPER; c.fillRect(0, 0, W, H);
    c.lineJoin = 'round';
    for (const sd of SIDES) {   // the timber and cables at this pier: pale, behind, into the soil only as far as the feet go (75 mm)
      const { sx, sy } = sd, [h0, h1] = HALF[sd.n];
      c.save(); c.beginPath(); c.rect(h0 + 6, 0, h1 - h0 - 12, GY + 0.075 * S); c.clip();
      c.lineCap = 'round';
      for (const cb of sd.sd.cables) { c.strokeStyle = `rgba(${INK},.22)`; c.lineWidth = 1; line(c, Array.from({ length: cb.length / 3 }, (_, i) => [sx(cb[3 * i]), sy(cb[3 * i + 1])])); }
      c.lineCap = 'butt';
      const byDepth = [...sd.sd.members].sort((a, b) => b.pts[2] + b.pts.at(-1) - a.pts[2] - a.pts.at(-1));
      for (const m of byDepth) {
        const pts = Array.from({ length: m.pts.length / 3 }, (_, i) => [sx(m.pts[3 * i]), sy(m.pts[3 * i + 1])]), w = Math.max(2, m.w / 1000 * S);
        c.strokeStyle = `rgba(${INK},.16)`; c.lineWidth = w + 1.6; line(c, pts);
        c.strokeStyle = 'rgb(232,228,214)'; c.lineWidth = w; line(c, pts);
      }
      c.restore();
    }
    c.lineCap = 'round';
    c.strokeStyle = `rgba(${INK},.45)`; c.lineWidth = 1; line(c, [[0, GY], [W, GY]]);   // one soil line across the slide

    // the study: the six openings in plan, each just the pier's feet in their ring, the ring widening left to right
    const { y, PS } = STRIP;
    D.study.forEach((o, i) => {
      const x = STRIP.x(i);
      c.strokeStyle = `rgba(${INK},.18)`; c.lineWidth = 1; c.beginPath(); c.arc(x, y, o.ring * PS, 0, TAU); c.stroke();
      c.fillStyle = `rgba(${INK},.8)`;
      for (const q of o.feet) { c.beginPath(); for (let k = 0; k < 4; k++) c[k ? 'lineTo' : 'moveTo'](x + q[2 * k] / 1000 * PS, y - q[2 * k + 1] / 1000 * PS); c.closePath(); c.fill(); }
      if (o.design) { c.strokeStyle = `rgb(${INK})`; c.lineWidth = 1.2; c.beginPath(); c.arc(x, y, o.ring * PS + 9, 0, TAU); c.stroke(); }
      text(c, `${o.light} of 24`, x, y + 52, 18, `rgb(${INK})`, SANS, 'center');
      text(c, `${o.wayIn.toFixed(1)} m`, x, y + 76, 18, `rgb(${INK})`, SANS, 'center');
      text(c, o.ok ? (o.design ? 'fits: the design' : 'fits') : 'does not fit', x, y + 100, 18, o.ok ? `rgb(${INK})` : `rgb(${RED})`, SANS, 'center');   // the footing draft's verdict, in the one red where it rejects
    });
    // what each row of the study says
    text(c, 'Six openings tried', STRIP.head, y + 6, 18, `rgb(${INK})`, SANS, 'right');
    text(c, 'climbers in the sun they ask for', STRIP.head, y + 52, 18, `rgba(${INK},.85)`, SANS, 'right');
    text(c, 'way in between piers', STRIP.head, y + 76, 18, `rgba(${INK},.85)`, SANS, 'right');
    text(c, 'buried footing', STRIP.head, y + 100, 18, `rgba(${INK},.85)`, SANS, 'right');
    // the first plan is the left picture's opening and the fifth the right's: a fine line up to each pier's foot
    for (const [i, n] of [[0, 0], [4, 1]]) { c.strokeStyle = `rgba(${INK},.28)`; c.lineWidth = 1; line(c, [[STRIP.x(i), GY + 0.075 * S + 4], [STRIP.x(i), y - D.study[i].ring * PS - (D.study[i].design ? 14 : 6)]]); }

    // the one sentence, between the two pictures it joins; and the rail: the ten years
    ['The same pier and the same', 'four climbers, grown twice', 'by the plant simulator.'].forEach((s, i) => text(c, s, (UX[0] + UX[1]) / 2, 392 + i * 34, 24, `rgb(${INK})`, SANS, 'center', '', 10));
    const { x0, x1 } = RAIL, ry = RAIL.y;
    c.strokeStyle = `rgb(${INK})`; c.lineWidth = 1; line(c, [[x0, ry], [x1, ry]]);
    for (let yr = Y0; yr <= Y1; yr++) {
      c.strokeStyle = `rgba(${INK},.6)`; line(c, [[railX(YS[yr]), ry - 4], [railX(YS[yr]), ry + 4]]);
      if (yr < Y1) text(c, String(yr), railX((YS[yr] + YS[yr + 1]) / 2), ry + 27, 17, `rgba(${INK},.85)`, SANS, 'center');
    }
  }

  // buckets: one path per colour and width (a quarter pixel), so tens of thousands of marks are a few hundred strokes
  const BK = [], ACTIVE = [];
  const bucket = (c, w) => { const wi = Math.min(63, Math.round(w * 4)), key = c * 64 + wi; let b = BK[key]; if (!b) b = BK[key] = { style: COLOURS[c], w: wi / 4, xy: [] }; if (!b.xy.length) ACTIVE.push(b); return b; };
  function flush(fill) {
    for (const b of ACTIVE) {
      const xy = b.xy;
      ctx.beginPath();
      if (fill) { ctx.fillStyle = b.style; for (let i = 0; i < xy.length; i += 3) { ctx.moveTo(xy[i] + xy[i + 2], xy[i + 1]); ctx.arc(xy[i], xy[i + 1], xy[i + 2], 0, TAU); } ctx.fill(); ctx.strokeStyle = 'rgba(16,40,32,.25)'; ctx.lineWidth = 0.6; ctx.stroke(); }
      else { ctx.strokeStyle = b.style; ctx.lineWidth = b.w; for (let i = 0; i < xy.length; i += 4) { ctx.moveTo(xy[i], xy[i + 1]); ctx.lineTo(xy[i + 2], xy[i + 3]); } ctx.stroke(); }
      xy.length = 0;
    }
    ACTIVE.length = 0;
  }

  /** One side's climbers on a (whole) day, far layers first. */
  function climbers(sd, day) {
    const { sx, sy, LAYERS, SEA, LEAFC, FLOWC, LEAFW, PL, TIP, POW, LAST } = sd;
    const year = yearOf(day), sea = SEA.map((s) => s[year]);
    const [h0, h1] = HALF[sd.n];
    ctx.save(); ctx.beginPath(); ctx.rect(h0 + 6, 0, h1 - h0 - 12, GY + 2); ctx.clip();
    for (const Ly of LAYERS) {
      const Lr = Ly.years[year];
      ctx.lineCap = 'round';
      for (const g of Lr.segs) {
        if (g.bornA > day || g.born > day || (g.gone >= 0 && day >= g.gone) || (g.goneA >= 0 && day >= g.goneA)) continue;
        const age = clamp((day - g.born) / Math.max(1, LAST - g.born)), r = (TIP + Math.max(0, g.rad - TIP) * age ** POW) / 1000 * S;
        bucket(STEMC, Math.max(MIN_W, 2 * r)).xy.push(g.x0, g.y0, g.x1, g.y1);
      }
      flush(false);
      ctx.lineCap = 'butt';
      for (const l of Lr.leaves) {   // a plain mark along the stalk, as long as the leaf is open, coloured as far as it has turned
        if (l[11] > day) break;
        if (day >= l[16]) continue;
        const st = leafState(l, sea[l[0]], day);
        if (!st || st[0] <= 0.02) continue;
        const open = st[0], len = Math.max(1.5, l[7] / 1000 * (0.25 + 0.75 * open) * S * (l[6] / 100)), x = l[14], y = l[15];
        bucket(LEAFC[l[0]][Math.min(2, Math.floor(l[13] / 1000 * 3))][Math.round(st[1] * 5)], Math.max(1.4, l[7] / 1000 * LEAFW[l[0]] * S * (0.4 + 0.6 * open))).xy.push(x, y, x + l[4] / 100 * len, y - l[5] / 100 * len);
      }
      flush(false);
      ctx.lineCap = 'round';
      for (const f of Lr.flowers) {
        if (f[5] > day) break;
        if (f[6] >= 0 && day >= f[6]) continue;
        const c = FLOWC[f[0]][Math.min(2, Math.floor(f[7] / 1000 * 3))], x = sx(f[1]), y = sy(f[2]), len = f[4] / 1000 * S;
        if (PL[f[0]].look.bloom === 'raceme') bucket(c, Math.max(2.5, len * 0.2)).xy.push(x, y, x, y + len);
      }
      flush(false);
      for (const f of Lr.flowers) {
        if (f[5] > day) break;
        if ((f[6] >= 0 && day >= f[6]) || PL[f[0]].look.bloom === 'raceme') continue;
        bucket(FLOWC[f[0]][Math.min(2, Math.floor(f[7] / 1000 * 3))], 0).xy.push(sx(f[1]), sy(f[2]), Math.max(1.8, f[4] / 2000 * S));
      }
      flush(true);
    }
    ctx.restore();
  }

  /** The highest these four have reached by a day, metres above the soil. */
  function reached(sd, day) {
    const r = sd.sd.reached;
    let lo = 0, hi = r.length - 1, best = -1;
    while (lo <= hi) { const m = (lo + hi) >> 1; if (r[m][0] <= day) { best = m; lo = m + 1; } else hi = m - 1; }
    return best < 0 ? 0 : r[best][1] / 100;
  }

  let drawn = null, lastMs = 0;
  /** The picture on a day: only the plants, the running words and the handle change. */
  function frame(dayF) {
    const day = Math.floor(clamp(dayF, PLANTED, LASTDAY));
    const t0 = performance.now();
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.drawImage(back, 0, 0);
    ctx.setTransform(K, 0, 0, K, 0, 0);
    ctx.lineJoin = 'round'; ctx.lineCap = 'round';
    for (const sd of SIDES) climbers(sd, day);
    // over each half, top left: its title, how many of its climbers are in their light, and how high they have reached
    for (const sd of SIDES) {
      const x = WORDS[sd.n];
      text(ctx, sd.sd.title, x, 70, 44, `rgb(${INK})`, DISPLAY, 'left', 'italic', 8);
      text(ctx, `${sd.sd.inLight} of 4 get the sun they ask for`, x, 102, 20, `rgb(${INK})`, SANS, 'left', '', 6);
      text(ctx, `reached ${reached(sd, day).toFixed(1)} m`, x, 128, 20, `rgba(${INK},.85)`, SANS, 'left', '', 6);
      if (sd.sd.placeholder) text(ctx, 'PLACEHOLDER: not the legs-together run', (HALF[sd.n][0] + HALF[sd.n][1]) / 2, 400, 28, `rgb(${RED})`, SANS, 'center', '', 8);
    }
    // the handle
    const hx = railX(day + 0.5);
    ctx.fillStyle = `rgb(${INK})`; ctx.fillRect(hx - 4.5, RAIL.y - 11, 9, 22);
    lastMs = performance.now() - t0;
    drawn = day;
  }

  // ---- playing: the slow ten years, and the hand that takes over ----
  let paused = false, hand = null, tp = 0, clock = 0, last = performance.now();
  const RESUME = 0;   // seconds after the hand lets go before it carries on: at once, since nothing here pauses it
  const current = () => (STILL ? JUNE10 : hand ? hand.day : dayAt(tp));
  function draw(force) { const d = current(); if (force || Math.floor(clamp(d, PLANTED, LASTDAY)) !== drawn) frame(d); }
  function loop(ms) {
    const dt = Math.min(0.1, (ms - last) / 1000); last = ms;
    if (!paused) {
      clock += dt;
      if (hand && !hand.down && clock - hand.up > RESUME) { tp = hand.day >= JUNE10 ? MOVE : timeOf(hand.day); hand = null; }   // the hand has let go: carry on from where it stands
      else if (!hand) tp = (tp + dt) % DUR;
    }
    draw(false);
    requestAnimationFrame(loop);
  }
  function take(day, down) {
    if (!hand) hand = { day: dayAt(tp), down: true, up: clock };
    hand.day = clamp(day, PLANTED, LASTDAY); hand.down = down; if (!down) hand.up = clock;
    paused = false; draw(false);
  }
  const toStage = (e) => { const r = canvas.getBoundingClientRect(); return [(e.clientX - r.left) / r.width * W, (e.clientY - r.top) / r.height * H]; };
  const railDay = (x) => YS[Y0] + (x - RAIL.x0) / (RAIL.x1 - RAIL.x0) * (YS[Y1] - YS[Y0]);
  let drag = null;
  canvas.addEventListener('pointerdown', (e) => {
    if (STILL) return;
    canvas.setPointerCapture(e.pointerId);
    const [x, y] = toStage(e), onRail = y > RAIL.y - 30;
    if (!onRail && y > GY) return;   // the study and the sentence do not take a hand
    drag = { x, onRail };
    take(onRail ? railDay(x) : hand ? hand.day : dayAt(tp), true);
  });
  canvas.addEventListener('pointermove', (e) => {
    if (!drag) return;
    const [x] = toStage(e);
    take(drag.onRail ? railDay(x) : hand.day + (x - drag.x) * (YS[Y1] - YS[Y0]) / (RAIL.x1 - RAIL.x0), true);
    drag.x = x;
  });
  const release = () => { if (!drag) return; drag = null; take(hand.day, false); };
  canvas.addEventListener('pointerup', release); canvas.addEventListener('pointercancel', release);

  $('realbtn').onclick = () => { const open = $('real').hidden; $('real').hidden = !open; $('realbtn').setAttribute('aria-expanded', String(open)); };
  const thinned = D.kept < 1 ? ` To keep the page light, ${Math.round((1 - D.kept) * 100)} in every hundred leaves are left out, evenly and the same on both sides.` : '';
  [
    `Every stem, leaf and flower is the plant simulator’s: two runs, one seed each, the same planting on two versions of the building, on this study’s designed site. The species numbers are provisional assumptions, not measured on plants.${D.sides[0].placeholder ? ' For now the left picture is the design run again, marked as a placeholder, until the legs-together run is gathered.' : ''}`,
    `Leaves and flowers are plain marks in each species’ colour, when and where the runs put them, not portraits. Stems are as thick as the runs make them, but none thinner than 18 mm, so the young ones read.${thinned} Both pictures are drawn at ${S} px to the metre on the slide: the left pier about its legs together (a ring 0.7 m across), the right about its legs apart (2.4 m).`,
    'The strip’s figures are the simulator’s reading of each species’ light against its own provisional profile, the building model’s way in between the piers, and this study’s ground draft for the footing, which is not engineering. One run and one seed for each opening.',
    'Across the room the two runs end with about the same total length of stem; what differs is light, height and flower. The timber and cables are the building model’s, at this pier. A scenario, not a forecast.',
  ].forEach((s) => $('real').append(Object.assign(document.createElement('p'), { textContent: s })));

  function fit() {
    const k = Math.min(innerWidth / W, innerHeight / H), dpr = window.devicePixelRatio || 1;
    document.documentElement.style.setProperty('--k', k);
    K = Math.min(3, k * dpr); canvas.width = Math.round(W * K); canvas.height = Math.round(H * K);
    drawBack(); draw(true);
  }
  addEventListener('resize', fit);
  window.__duration = DUR;
  window.__setT = (t) => { hand = null; tp = clamp(t, 0, DUR - 0.001); paused = true; draw(true); };   // draws at once
  window.__play = () => { hand = null; paused = false; draw(true); };
  window.__frameMs = () => lastMs;   // the last frame's drawing time, measured around the draw
  window.__dayAt = dayAt;
  fit();
  if (!STILL) requestAnimationFrame(loop);
  document.fonts?.ready.then(() => { drawBack(); draw(true); });
  window.__ready = true;
})();
</script>
</body>
</html>
