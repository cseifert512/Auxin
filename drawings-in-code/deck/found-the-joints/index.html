<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The clinging plants found the joints</title>
<!--
  A finding from growing a planting on the room, addressed to single joints, and the change to the
  building it led to. It plays by itself as a loop of four named steps (We want, We ask, We
  reconsider, We ask again); the viewer may pause it, move along it, or go to a step.

  The pictures are the studio's own drawing, made beforehand by `node pipeline/vignette.mjs
  found-the-joints` (manifest.js says which, and where each joint falls in each view). This page
  only shows them in turn and draws the annotation over them: marks on the joints, leaders, and
  the joint cut through and seen from above, which is drawn to scale from the numbers the
  building's generator used (data.js). It opens from its folder; add ?embed to leave out the
  small print. Hooks: __setT(seconds), __play(), __duration, __ready.

  That a stem in a narrow gap wedges it is the reason for the cut. It is general knowledge of
  clinging plants: the simulator does not show it and the plant library does not source it.
-->
<style>
  :root { --paper: #EEF3EA; --ink: #102820; --red: #B4492F; --rule: rgba(16, 40, 32, .2); --soft: rgba(16, 40, 32, .62); }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--paper); color: var(--ink); font: 14px/1.45 "Segoe UI", system-ui, sans-serif; }
  #page { max-width: 1320px; margin: 0 auto; padding: 0 22px; }
  header { display: flex; align-items: baseline; gap: 16px; padding-top: 14px; }
  h1 { font: 400 24px/1.1 Georgia, "Times New Roman", serif; margin: 0; flex: 1; }
  #pp { font: inherit; font-size: 12px; color: var(--soft); background: none; border: 0; padding: 0; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
  #cap { font-size: 15px; min-height: 1.5em; margin: 4px 0 2px; color: var(--soft); }
  #stage { position: relative; width: 100%; aspect-ratio: 1260 / 640; overflow: hidden; }
  #stage img { position: absolute; opacity: 0; pointer-events: none; }
  #over { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 10; }   /* the annotation lies over the pictures */
  #bar { height: 16px; position: relative; cursor: pointer; touch-action: none; margin-top: 6px; }
  #bar::before { content: ""; position: absolute; left: 0; right: 0; top: 7px; height: 1px; background: var(--rule); }
  #fill { position: absolute; left: 0; top: 6px; height: 3px; width: 0; background: var(--ink); }
  #steps { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); list-style: none; margin: 0; padding: 2px 0 0; gap: 8px; }
  #steps button { font: inherit; background: none; border: 0; padding: 4px 0; text-align: left; width: 100%; color: var(--soft); cursor: pointer; }
  #steps .on button { color: var(--ink); }
  footer { font-size: 11px; color: var(--soft); padding: 10px 0 14px; }
  footer p { margin: 0 0 4px; }
  .embed footer { display: none; }
</style>
</head>
<body>
<div id="page">
  <header><h1>The clinging plants found the joints</h1><button id="pp" aria-pressed="false">Pause</button></header>
  <p id="cap"></p>
  <div id="stage"><canvas id="over"></canvas></div>
  <div id="bar"><div id="fill"></div></div>
  <ol id="steps"></ol>
  <footer>
    <p>A growth scenario on stated assumptions, not a forecast. The cut is set out, not proved.</p>
  </footer>
</div>
<script src="manifest.js"></script>
<script src="data.js"></script>
<script>
(() => {
  const V = window.VIGNETTE, D = window.VIGNETTE_DATA;
  const $ = (id) => document.getElementById(id);
  if (new URLSearchParams(location.search).has("embed")) document.body.classList.add("embed");
  const INK = "16,40,32", RED = "180,73,47", PAPER = "#EEF3EA";
  const seg = (t, a, b) => Math.max(0, Math.min(1, (t - a) / (b - a)));
  const ease = (u) => u * u * (3 - 2 * u);
  const win = (t, a, b, f = 0.35) => Math.min(seg(t, a, a + f), 1 - seg(t, b - f, b));
  const mm = (x) => Math.round(x * 1000);

  // ---- the loop -------------------------------------------------------------------------------
  const DUR = 40, BND = [0, 8, 17, 31, 40], STATIC_T = 37, LAST = D.lastDay;
  const STEPS = [
    ["We want", "Timber the plants hold for themselves."],
    ["We ask", `Where does that take them? To ${D.inRun} of the room's ${D.total} joints.`],
    ["We reconsider", "A stem follows the timber into the gap, and thickens there."],
    ["We ask again", `Grown again: ${D.always} joints every time, ${D.sometimes} only sometimes.`],
  ];
  const stepOf = (t) => Math.max(0, BND.findIndex((b, i) => t >= b && t < BND[i + 1]));
  const captionAt = (t) => (t >= 24.2 && t < 31 ? `So ${D.laps} laps are cut open where the stem lies.` : STEPS[stepOf(t)][1]);
  const dayAt = (t) => (t < 8.15 ? ease(seg(t, 0.6, 7)) : ease(seg(t, 8.6, 15.5))) * LAST;
  let T_REACH = 15.5;   // the moment in "We ask" when the joint drawn close to is reached
  for (let t = 8.6; t <= 15.5; t += 0.05) if (dayAt(t) >= D.close.day) { T_REACH = t; break; }
  const end = (t) => 1 - seg(t, 39.3, 40);

  // ---- the pictures ----------------------------------------------------------------------------
  const stage = $("stage"), canvas = $("over"), ctx = canvas.getContext("2d");
  const IMG = { room: new Map(), close: new Map() };   // view -> "set:i" -> its picture
  for (const [id, set] of Object.entries(V.sets)) for (const [view, files] of Object.entries(set.views)) files.forEach((file, i) => {
    const img = new Image();
    img.decoding = "sync"; img.alt = ""; img.src = file;   // a picture is ready before it is shown, so none comes in late
    stage.insertBefore(img, canvas);
    IMG[view].set(`${id}:${i}`, img);
  });
  const lit = { room: new Map(), close: new Map() };
  function show(view, list) {   // list: [key, opacity], drawn in that order
    const now = new Map(list.filter(([, a]) => a > 0.002));
    for (const key of lit[view].keys()) if (!now.has(key)) IMG[view].get(key).style.opacity = 0;
    let z = 1;
    for (const [key, a] of now) { const img = IMG[view].get(key); img.style.opacity = a; img.style.zIndex = z++; }
    lit[view] = now;
  }
  const grownAt = (day) => {   // the two pictures of the growing run either side of a day, and how far between them
    const days = V.sets.grown.days, f = Math.max(0, Math.min(days.length - 1, day / LAST * (days.length - 1))), lo = Math.min(days.length - 2, Math.floor(f));
    return [`grown:${lo}`, `grown:${lo + 1}`, f - lo];
  };

  let W = 0, H = 0, U = 1, RECT = { room: null, close: null };
  function layout() {
    const r = stage.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
    W = r.width; H = r.height;
    canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
    const a = V.views.room.size, b = V.views.close.size, gap = 30, k = Math.min(W / (a[0] + gap + b[0]), H / Math.max(a[1], b[1] + 20));
    const x0 = (W - (a[0] + gap + b[0]) * k) / 2;
    RECT.room = { x: x0, y: (H - a[1] * k) / 2, w: a[0] * k, h: a[1] * k };
    RECT.close = { x: x0 + (a[0] + gap) * k, y: (H - b[1] * k) / 2 + 8, w: b[0] * k, h: b[1] * k };
    for (const view of ["room", "close"]) for (const img of IMG[view].values()) Object.assign(img.style, { left: RECT[view].x + "px", top: RECT[view].y + "px", width: RECT[view].w + "px", height: RECT[view].h + "px" });
    U = Math.max(0.8, Math.min(1.25, W / 1000));
  }
  const at = (view, p) => [RECT[view].x + p[0] * RECT[view].w, RECT[view].y + p[1] * RECT[view].h];
  const inside = (p) => p[0] > 0.02 && p[0] < 0.98 && p[1] > 0.02 && p[1] < 0.98;

  // ---- annotation: paper boxes, leaders and marks, as the factory drawings have them -------------------
  function box(x, y, text, alpha, red, anchor) {
    const lines = text.split("\n"), size = 12.5 * U, pad = 3;
    ctx.font = `${size}px "Segoe UI", system-ui, sans-serif`;
    const w = Math.max(...lines.map((l) => ctx.measureText(l).width)), h = lines.length * size * 1.3;
    const x0 = Math.max(4, Math.min(W - w - 4 - 2 * pad, anchor === "end" ? x - w - 2 * pad : x));
    y = Math.max(h / 2 + pad + 2, Math.min(H - h / 2 - pad - 2, y));   // a label stays on the sheet
    ctx.globalAlpha = alpha;
    ctx.fillStyle = PAPER; ctx.fillRect(x0, y - h / 2 - pad, w + 2 * pad, h + 2 * pad);
    ctx.fillStyle = red ? `rgb(${RED})` : `rgb(${INK})`; ctx.textBaseline = "middle";
    lines.forEach((l, i) => ctx.fillText(l, x0 + pad, y - h / 2 + size * 0.65 + i * size * 1.3));
    ctx.globalAlpha = 1;
  }
  function note(p, dx, dy, text, alpha, red, anchor) {
    if (alpha <= 0.01) return;
    ctx.globalAlpha = alpha;
    ctx.strokeStyle = red ? `rgb(${RED})` : `rgb(${INK})`; ctx.fillStyle = ctx.strokeStyle; ctx.lineWidth = 0.9;
    ctx.beginPath(); ctx.moveTo(p[0], p[1]); ctx.lineTo(p[0] + dx * U, p[1] + dy * U); ctx.stroke();
    ctx.beginPath(); ctx.arc(p[0], p[1], 2.2, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 1;
    box(p[0] + dx * U, p[1] + dy * U, text, alpha, red, anchor || (dx < 0 ? "end" : "start"));
  }
  function mark(p, alpha, filled, size) {
    if (alpha <= 0.01) return;
    ctx.globalAlpha = alpha;
    ctx.beginPath(); ctx.arc(p[0], p[1], size, 0, Math.PI * 2);
    if (filled) { ctx.fillStyle = `rgb(${RED})`; ctx.fill(); } else { ctx.fillStyle = PAPER; ctx.fill(); ctx.strokeStyle = `rgb(${RED})`; ctx.lineWidth = 1.4; ctx.stroke(); }
    ctx.globalAlpha = 1;
  }
  function small(x, y, text) {
    ctx.font = `${10.5 * U}px "Segoe UI", system-ui, sans-serif`;
    ctx.fillStyle = "rgba(16,40,32,.62)"; ctx.textBaseline = "alphabetic";
    ctx.fillText(text.toUpperCase().split("").join(" "), x, y);
  }

  // ---- the joint cut through and seen from above: what a stem does in the gap, and the cut that answers it ----
  // Drawn to scale. u is measured across the crossing member and s along it, so that member stands upright on the
  // page and a stem comes down its side.
  const STEM_YOUNG_M = 0.0012, STEM_OLD_M = 0.009;
  function section(t, alpha) {
    if (alpha <= 0.01) return;
    const r = RECT.close, S = Math.min(r.w / 0.17, r.h / 0.22), cx = r.x + r.w * 0.6, cy = r.y + r.h * 0.56;
    const X = (u, v) => [cx - S * u, cy - S * v];
    const { wA, wB, phi, c0, c1, land, mouth, depth } = D.section, sin = Math.sin(phi), cos = Math.cos(phi);
    const m = ease(seg(t, 24.4, 26.2)), moving = Math.sin(Math.PI * seg(t, 24.4, 26.2));
    const c = c0 + (c1 - c0) * m, h = wB / 2 + c;
    const sT = (wA / 2 - h * cos) / sin, sB = (-wA / 2 - h * cos) / sin, sM = (sT + sB) / 2;
    const flare = (sT - sB - land) / 2, open = mouth * m, hinge = sM + land / 2;
    const angle = flare > 0.01 ? Math.min(Math.atan2(open, flare), Math.PI / 4) : 0;
    const far = 0.4, along = [sin, -cos];
    const path = (pts) => { pts.forEach((q, i) => (i ? ctx.lineTo(q[0], q[1]) : ctx.moveTo(q[0], q[1]))); ctx.closePath(); };
    const shoulder = (k) => [[h, sT], [h + far * along[0], sT + far * along[1]], [h + far * along[0], sB + far * along[1]], [h, sB]].map(([u, v]) => X(k * u, k * v));
    const openings = (k) => (angle > 0.002 ? [1, -1].map((way) => {
      const Hg = [h, sM + way * land / 2], run = [Math.sin(angle), way * Math.cos(angle)], face = [Math.cos(angle), -way * Math.sin(angle)];
      const reach = flare / Math.cos(angle) + 0.05, thick = Math.min(open, 2 * h - 0.004);
      return [[0, 0], [reach, 0], [reach, -thick], [0, -thick]].map(([a, b]) => X(k * (Hg[0] + a * run[0] + b * face[0]), k * (Hg[1] + a * run[1] + b * face[1])));
    }) : []);
    ctx.save();
    ctx.beginPath(); ctx.rect(r.x, r.y, r.w, r.h); ctx.clip();
    ctx.globalAlpha = alpha;
    ctx.fillStyle = PAPER; ctx.fillRect(r.x, r.y, r.w, r.h);
    const b0 = X(wB / 2, 0)[0], b1 = X(-wB / 2, 0)[0];
    ctx.fillStyle = `rgba(${INK},.06)`; ctx.fillRect(b0, r.y, b1 - b0, r.h);
    ctx.strokeStyle = `rgb(${INK})`; ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.moveTo(b0, r.y); ctx.lineTo(b0, r.y + r.h); ctx.moveTo(b1, r.y); ctx.lineTo(b1, r.y + r.h); ctx.stroke();
    for (const k of [1, -1]) {
      const outline = shoulder(k), cut = openings(k);
      ctx.save();
      ctx.beginPath(); ctx.rect(r.x, r.y, r.w, r.h); for (const q of cut) path(q); ctx.clip("evenodd");
      ctx.beginPath(); path(outline);
      ctx.fillStyle = `rgba(${INK},.17)`; ctx.fill();
      ctx.strokeStyle = `rgb(${INK})`; ctx.lineWidth = 1.2; ctx.stroke();
      ctx.restore();
      ctx.save();
      ctx.beginPath(); path(outline); ctx.clip();
      ctx.strokeStyle = moving > 0.05 ? `rgb(${RED})` : `rgb(${INK})`; ctx.lineWidth = 2.4;
      for (const q of cut) { ctx.beginPath(); path(q); ctx.stroke(); }
      ctx.restore();
    }
    const first = t < 24.4, top = (r.h * 0.56) / S + 0.01;
    const grown = first ? ease(seg(t, 18.2, 20.6)) : ease(seg(t, 26.2, 27.4));
    const front = top + ((first ? sB + 0.25 * (sT - sB) : hinge) - top) * grown;
    const thick = STEM_YOUNG_M + (STEM_OLD_M - STEM_YOUNG_M) * (first ? ease(seg(t, 20.8, 23.4)) : ease(seg(t, 27, 28.4)));
    const room = (v) => (first ? (v > sT ? Infinity : c0) : c1 + Math.max(0, v - hinge) * Math.tan(angle));
    const seen = first ? seg(t, 18.2, 18.5) * (1 - seg(t, 23.8, 24.4)) : seg(t, 26.2, 26.6);
    const wedge = first ? seg(t, 21.2, 22.2) * (1 - seg(t, 23.8, 24.4)) : 0;
    if (seen > 0.01 && front < top) {
      const edge = [];
      for (let v = top; v > front; v -= 0.003) edge.push([v, Math.min(thick, room(v))]);
      edge.push([front, Math.min(thick, room(front))]);
      const shape = () => { ctx.beginPath(); edge.forEach(([v, w], i) => { const q = X(wB / 2 + w, v); if (i) ctx.lineTo(q[0], q[1]); else ctx.moveTo(q[0], q[1]); }); for (let i = edge.length - 1; i >= 0; i--) { const q = X(wB / 2, edge[i][0]); ctx.lineTo(q[0], q[1]); } ctx.closePath(); };
      ctx.globalAlpha = alpha * seen;
      shape(); ctx.fillStyle = "#3F7D3A"; ctx.fill();
      if (wedge > 0.01) {
        ctx.save();
        const y0 = X(0, sT)[1];
        ctx.beginPath(); ctx.rect(r.x, y0, r.w, r.y + r.h - y0); ctx.clip();
        ctx.globalAlpha = alpha * seen * wedge;
        shape(); ctx.fillStyle = `rgb(${RED})`; ctx.fill();
        const va = sT - 0.4 * (sT - sB), from = [X(wB / 2 + c0 + 0.002, va), X(wB / 2 - 0.002, va)], to = [X(wB / 2 + c0 + 0.02, va), X(wB / 2 - 0.02, va)];
        ctx.strokeStyle = `rgb(${RED})`; ctx.lineWidth = 1.6; ctx.lineCap = "round";
        from.forEach((a, i) => { const b = to[i], d = Math.sign(b[0] - a[0]); ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.moveTo(b[0] - d * 5, b[1] - 4); ctx.lineTo(b[0], b[1]); ctx.lineTo(b[0] - d * 5, b[1] + 4); ctx.stroke(); });
        ctx.restore();
      }
    }
    ctx.restore();
    ctx.globalAlpha = alpha;
    small(X(wB / 2, 0)[0] + 8, r.y + r.h - 10, "crossing");
    small(r.x + r.w - 62 * U, r.y + 18 * U, "notched");
    ctx.globalAlpha = 1;
    const put = (p, dx, dy, text, a, red) => {   // a note, kept inside the close view
      const x = Math.max(r.x + 8, Math.min(r.x + r.w - 178 * U, p[0] + dx * U)), y = Math.max(r.y + 22, Math.min(r.y + r.h - 24, p[1] + dy * U));
      note(p, (x - p[0]) / U, (y - p[1]) / U, text, a, red, "start");
    };
    const gap = X(wB / 2 + c0 / 2, sT - 0.3 * (sT - sB));
    put(gap, -96, 84, `a ${mm(c0)} mm gap`, alpha * win(t, 18.6, 21.2), true);
    put(gap, -96, 84, "it thickens: a wedge", alpha * win(t, 21.4, 24.1), true);
    const pocket = X(wB / 2 + mouth * 0.3, hinge + flare * 0.75), bears = X(-wB / 2, -sM);
    put(pocket, -70, -74, "open where the stem lies", alpha * win(t, 26.2, 28.6), false);
    put(bears, -40, 86, "shut where they bear", alpha * win(t, 26.6, 28.6), false);
  }

  // ---- one moment of the loop ---------------------------------------------------------------------
  const J = { room: V.views.room.points.joints, close: V.views.close.points.joints };
  const here = { room: V.views.room.points.joint, close: V.views.close.points.joint };
  const front = D.joints.map((j, i) => ({ ...j, i })).filter((j) => j.always).sort((a, b) => J.room[b.i][1] - J.room[a.i][1])[0];
  const high = D.joints.map((j, i) => ({ ...j, i })).filter((j) => !j.always).sort((a, b) => J.room[a.i][1] - J.room[b.i][1])[0];
  const lastOf = (id) => `${id}:${V.sets[id].moments.length - 1}`;
  function frame(t) {
    const day = dayAt(t), [lo, hi, mix] = grownAt(day);
    const dip = Math.min(seg(t, 0, 0.5), end(t), t < 8.15 ? 1 - seg(t, 7.6, 8) : seg(t, 8.3, 8.7));   // the planting clears and starts again
    const bare = ease(seg(t, 16.3, 17.1));                       // the plants are taken off, to see the joint as every lap is cut
    const cutThrough = seg(t, 17.2, 18) - seg(t, 28.6, 29.4);     // the close view turns into a cut through the joint, and back
    const recut = t >= 26 ? 1 : 0;                               // behind the cut through, the patch becomes the one that is now cut
    const again = ease(seg(t, 31.3, 32.4));                      // and the planting is on it again
    show("room", [[lo, dip], [hi, dip * mix], [lastOf("grown-now"), again * end(t)]]);
    show("close", recut ? [["bare-now:0", end(t)], [lastOf("grown-now"), again * end(t)]] : [[lo, dip], [hi, dip * mix], ["bare-was:0", bare]]);

    const dpr = window.devicePixelRatio || 1;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, W, H);
    const marks = t >= 8.6 ? end(t) : 0, sorted = seg(t, 31.3, 32.2) * end(t);
    for (const view of ["room", "close"]) {
      const fade = view === "close" ? 1 - cutThrough : 1;
      D.joints.forEach((j, i) => {
        const p = J[view][i];
        if (!inside(p)) return;
        const shown = j.inRun && j.day != null && day >= j.day ? marks : 0;
        const a = sorted > 0.01 ? Math.max(j.always ? shown : shown * (1 - sorted), sorted) : shown;
        mark(at(view, p), a * fade, sorted > 0.01 ? j.always : true, (view === "close" ? 5 : 3.3) * U);
      });
    }
    // where the close view is taken from
    const c0 = at("room", here.room), R2 = RECT.close;
    ctx.strokeStyle = "rgba(16,40,32,.38)"; ctx.lineWidth = 0.8;
    ctx.strokeRect(c0[0] - 9, c0[1] - 12, 18, 24);
    ctx.beginPath(); ctx.moveTo(c0[0] + 9, c0[1] - 12); ctx.lineTo(R2.x, R2.y); ctx.moveTo(c0[0] + 9, c0[1] + 12); ctx.lineTo(R2.x, R2.y + R2.h); ctx.stroke();
    section(t, cutThrough);
    ctx.strokeStyle = "rgba(16,40,32,.3)"; ctx.lineWidth = 0.8;
    ctx.strokeRect(R2.x, R2.y, R2.w, R2.h);
    const head = cutThrough > 0.5 ? "One joint, cut through" : t >= 28.6 && t < 39.3 ? "As it is now cut" : bare > 0.5 ? "As every lap is cut" : "One patch of roof";
    small(R2.x, R2.y - 7, head);
    const reachedNow = marks > 0.01 ? D.count.filter((c) => c.day <= day).pop() : null;
    small(RECT.room.x, RECT.room.y + 14 * U, `year ${Math.max(1, Math.ceil(day / 365.25 - 0.02))}` + (marks > 0.01 ? `  ·  ${reachedNow ? reachedNow.n : 0} of ${D.total} joints` : ""));

    // annotation: never more than two leaders at a time
    note(at("close", here.close), 30, 92, `year ${Math.ceil(D.close.day / 365.25)}: the ivy arrives`, win(t, T_REACH, Math.max(T_REACH + 4, 16.2)) * (1 - cutThrough), true);
    if (front) {
      note(at("room", J.room[front.i]), -64, 62, `${D.laps} laps cut this way`, win(t, 27, 30.8), false);
      note(at("room", J.room[front.i]), -64, 62, `every run: ${D.always}`, win(t, 32.2, 39.2), true);
    }
    if (high) note(at("room", J.room[high.i]), -44, -66, `some runs: ${D.sometimes} more`, win(t, 33.6, 39.2), false);
  }

  // ---- page: steps, caption, playing ----------------------------------------------------------------
  let shown = -1, said = "", paused = false, tp = 0, t0 = performance.now();
  function ui(t) {
    const k = stepOf(t), caption = captionAt(t);
    if (caption !== said) { said = caption; $("cap").textContent = caption; }
    if (k !== shown) { shown = k; [...$("steps").children].forEach((li, i) => li.classList.toggle("on", i === k)); }
    $("fill").style.width = (100 * t / DUR) + "%";
  }
  function loop(ms) {
    if (!paused) tp = ((ms - t0) / 1000) % DUR;
    frame(tp); ui(tp);
    requestAnimationFrame(loop);
  }
  function seek(t, play) {
    tp = Math.max(0, Math.min(DUR - 0.01, t));
    paused = !play; t0 = performance.now() - tp * 1000;
    $("pp").textContent = paused ? "Play" : "Pause"; $("pp").setAttribute("aria-pressed", paused);
    frame(tp); ui(tp);
  }
  STEPS.forEach(([name], i) => {
    const li = document.createElement("li"), b = document.createElement("button");
    b.textContent = name;
    b.onclick = () => seek(BND[i] + 0.01, true);
    li.append(b); $("steps").append(li);
  });
  $("pp").onclick = () => seek(tp, paused);
  const bar = $("bar"), scrub = (e) => { const r = bar.getBoundingClientRect(); seek(DUR * (e.clientX - r.left) / r.width, false); };
  bar.onpointerdown = (e) => { bar.setPointerCapture(e.pointerId); scrub(e); bar.onpointermove = scrub; };
  bar.onpointerup = () => { bar.onpointermove = null; };

  new ResizeObserver(() => { layout(); frame(tp); }).observe(stage);
  layout();
  ui(0);
  window.__duration = DUR;
  window.__setT = (t) => seek(t, false);
  window.__play = () => seek(tp, true);
  const every = [...stage.querySelectorAll("img")];
  Promise.all(every.map((img) => img.decode().catch(() => {}))).then(() => {   // start once every picture can be drawn
    if (matchMedia("(prefers-reduced-motion: reduce)").matches) { seek(STATIC_T, false); $("pp").hidden = true; }
    else { t0 = performance.now(); requestAnimationFrame(loop); }
    window.__ready = true;
  });
})();
</script>
</body>
</html>
