<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The place</title>
<!--
  A drawing to explore: the whole place first, then into it. Pictures, places and figures were made beforehand
  (manifest.js, by package_place.py); this page only chooses what to show, and opens from its folder.
  ?embed ?station= ?moment= (a moment id or day:<n>) ?life=1 ?still. Hooks and messages: README.md.
-->
<link rel="stylesheet" href="place.css">
</head>
<body class="place">
<div id="stage">
  <header>
    <button id="back" type="button">← The place</button>
    <h1 id="title"></h1>
    <div class="tools">
      <button id="lifebtn" type="button" aria-pressed="false" title="Birds: an illustration, not a finding">Life</button>
      <button id="realbtn" type="button" aria-expanded="false">What is real</button>
    </div>
  </header>
  <div id="pic" aria-live="polite"><svg id="life" aria-hidden="true"></svg></div>
  <aside id="rail">
    <p id="caption"></p>
    <ul id="figures"></ul>
    <div id="real" hidden><ul id="reallines"></ul><p class="from" id="realfrom"></p></div>
  </aside>
  <nav id="dial" aria-label="When">
    <button id="play" type="button">▶ Play</button>
    <strong id="date"></strong>
    <div class="track">
      <input id="scrub" type="range" min="0" max="1" step="1" value="0" aria-label="Day">
      <ol id="ticks"></ol>
    </div>
  </nav>
</div>
<script src="manifest.js"></script>
<script src="place.js"></script>
</body>
</html>
